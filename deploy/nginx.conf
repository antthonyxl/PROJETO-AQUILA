worker_processes auto;
events { worker_connections 2048; }
http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=aq_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=aq_conn:10m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    split_clients "$request_id" $initial_route {
        25% 1;
        25% 2;
        25% 3;
        * 4;
    }
    map $cookie_aq_route $route {
        default $initial_route;
        1 1;
        2 2;
        3 3;
        4 4;
    }
    # A porta publicada fica em loopback. O proxy HTTPS local deve sobrescrever
    # X-Forwarded-Proto, sem reutilizar o valor enviado pelo cliente.
    map $http_x_forwarded_proto $external_scheme {
        default $scheme;
        https https;
        http http;
    }
    map $external_scheme $cookie_secure { default ''; https '; Secure'; }
    upstream aquila_1 { server aq1:8501; }
    upstream aquila_2 { server aq2:8501; }
    upstream aquila_3 { server aq3:8501; }
    upstream aquila_4 { server aq4:8501; }
    server {
        listen 80;
        client_max_body_size 260m;
        location / {
            limit_conn aq_conn 40;
            limit_req zone=aq_req burst=60 nodelay;
            add_header Set-Cookie "aq_route=$route; Path=/; HttpOnly; SameSite=Lax$cookie_secure" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
            proxy_pass http://aquila_$route;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            # Uma sessão Streamlit não pode migrar para outro processo no meio da conexão.
            proxy_next_upstream off;
        }
    }
}
