[theme]
base = "light"
primaryColor = "#238AFF"
backgroundColor = "#F1F6FD"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#233750"
font = "sans serif"

[server]
maxUploadSize = 250
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
